<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kOTTe - Its My OTT </title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }
  .stage {
    width: 100%;
    height: 100%;
    max-width: 1920px;
    max-height: 1080px;
    display: flex;
    flex-direction: column;
    padding: 0;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  h1 {
    font-size: .8rem;
    margin: 0 0 0px 0;
    font-weight: 500;
  }

  .layout {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  /* LEFT: player — now the only thing in the flow; fills the whole viewport */
  .player-col {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .toggle-btn {
    position: absolute;
    top: 30px;
    right: calc(var(--pl-w) + 24px);
    z-index: 30;
    background: rgba(255,255,255,0.06);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.72rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, right 0.2s;
  }
  .toggle-btn.panel-hidden {
    right: 14px;
  }
  .toggle-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.05); }
  .toggle-btn.selected {
    background: rgba(93,169,255,0.1);
    border-color: rgba(93,169,255,0.5);
    color: #fff;
  }
  .controls-toggle-btn {
    position: absolute;
    bottom: 15px;
    left: 25px;
    z-index: 30;
    background: rgba(255,255,255,0.01);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.72rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .controls-toggle-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.05); }
  .player-wrap {
    background: #000;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 0;
    position: relative;
  }
  video {
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #000;
    border-radius: 0;
    display: block;
    object-fit: contain;
    object-position: center center;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  video.idle {
    opacity: 0;
  }
  .now-playing {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 40px;
    z-index: 5;
    margin-top: 0px;
    font-size: 0.78rem;
    color: #5da9ff;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    flex-wrap: wrap;
    background: rgba(15,15,15,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 8px 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .player-wrap:hover .now-playing,
  .now-playing:focus-within,
  .now-playing.force-visible {
    opacity: 1;
    pointer-events: auto;
  }
  /* Manual override from the show/hide button — always wins, even on hover/pause */
  .now-playing.pinned-hidden {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #nowPlaying {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .media-badge {
    flex-shrink: 0;
    margin-left: 8px;
    font-size: 0.68rem;
    color: #9ab;
    white-space: nowrap;
  }
  .media-badge:empty { display: none; }
  .xray-tech {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 0.74rem;
    line-height: 1.6;
    color: #cfd8e3;
  }
  .xray-tech:empty { display: none; }
  .xray-tech b { color: #fff; font-weight: 600; }
  .xray-tech .tech-h { color: #5da9ff; font-size: 0.68rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
  .custom-controls {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.01);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.72rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  .ctrl-btn.hq-on {
    background: rgba(93,169,255,0.1);
    border-color: rgba(93,169,255,0.1);
    color: #fff;
    box-shadow: 0 0 6px rgba(93,169,255,0.1);
  }
  #video.hq-enhanced {
    filter: contrast(1.12) saturate(1.18) brightness(1.03);
  }

  /* ---- Timeline / seek bar (full-width row on top of the controls bar) ---- */
  .timeline {
    order: -1;
    flex: 0 0 100%;
    width: 100%;
    height: 22px;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }
  .timeline-track {
    contain: layout style;
    position: relative;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: #2f8cff;            /* remaining = blue */
    transition: height 0.12s ease;
  }
  .timeline:hover .timeline-track,
  .timeline.dragging .timeline-track,
  .timeline:focus-visible .timeline-track { height: 7px; }
  .timeline-elapsed {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    border-radius: 999px;
    background: #9a9a9a;            /* elapsed = grey */
    pointer-events: none;
  }
  .timeline-dot {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #2f8cff;
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: transform 0.12s ease;
  }
  .timeline:hover .timeline-dot,
  .timeline.dragging .timeline-dot,
  .timeline:focus-visible .timeline-dot { transform: scale(1.25); }
  .timeline:focus .timeline-track { height: 7px; }
  .timeline:focus .timeline-dot {
    transform: scale(1.25);
    box-shadow: 0 0 0 4px rgba(47,140,255,0.6), 0 0 8px rgba(0,0,0,0.7);
  }
  .timeline-tip {
    position: absolute;
    bottom: 22px;
    left: 0;
    transform: translateX(-50%);
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(0,0,0,0.85);
    color: #fff;
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .timeline:hover .timeline-tip,
  .timeline.dragging .timeline-tip { opacity: 1; }

  #runtime {
    color: #5da9ff;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .subtitle-btn {
    background: rgba(255,255,255,0.06);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.68rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .subtitle-btn:hover { background: rgba(255,255,255,0.18); color: #eee; border-color: rgba(255,255,255,0.1); }
  .subtitle-btn.on {
    background: rgba(93,169,255,0.1);
    border-color: rgba(93,169,255,0.1);
    color: #fff;
  }
  .subtitle-btn.loading {
    background: rgba(255,255,255,0.01);
    border-color: rgba(255,255,255,0.1);
    color: #888;
    cursor: default;
  }
  .subtitle-btn.unavailable {
    background: rgba(160,60,60,0.1);
    border-color: rgba(160,60,60,0.1);
    color: #c99;
    cursor: not-allowed;
  }

  /* ---- C-Safe glitch overlay: image sequence (canvas) layered over the main video during blurTimecodes ---- */
  #glitchVideo {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;              /* above the video, below subtitles (4) and controls (5+) */
    visibility: hidden;
    pointer-events: none;
    opacity: 0;              /* invisible by default; JS sets it inside blur ranges */
    background: transparent;
  }
  #subtitleOverlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6%;
    text-align: center;
    pointer-events: none;
    z-index: 4;
    padding: 0 5%;
  }
  #subtitleOverlay span {
    display: inline-block;
    background: rgba(0,0,0,0.1);
    color: #fff;
    font-size: 1.4rem;
    line-height: 1.35;
    padding: 3px 10px;
    border-radius: 4px;
    white-space: pre-line;
  }
  .aspect-btn {
    background: rgba(255,255,255,0.06);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 0.62rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .aspect-btn:hover { background: rgba(255,255,255,0.18); color: #eee; border-color: rgba(255,255,255,0.5); }
  .aspect-btn.active {
    background: rgba(93,169,255,0.1);
    border-color: rgba(93,169,255,0.1);
    color: #fff;
  }

  /* Aspect ratio / fit modes for the video element.
     Attribute selector gives higher specificity than the base `video` rule. */
  video[data-ratio="fit"] {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center center;
  }
  video[data-ratio="fill"] {
    width: 100%;
    height: 100%;
    object-fit: fill;
    object-position: center center;
  }
  video[data-ratio="zoom"] {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
  }
  video[data-ratio="16:9"] {
    width: 120%;
    height: 120%;
    object-fit: cover;
    object-position: center center;
  }
  video[data-ratio="4:3"] {
    flex: 0 1 auto;
    width: auto;
    height: 100%;
    max-width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    object-position: center center;
    margin: auto;
    align-self: center;
  }
  video[data-ratio="squeeze"] {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center center;
    transform: scaleY(0.80);
    transform-origin: center center;
  }
  #clock {
    color: #5da9ff;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* Playlist panel width + grid size. Change these to resize the title menu. */
  :root {
    --pl-w: min(46vw, 600px);   /* panel width: stays in the right half of the screen */
    --pl-cols: 6;               /* columns */
    --pl-rows: 4;               /* rows visible before the scrollbar kicks in */
    --pl-row-h: 76px;           /* height of one card row */
    --pl-gap: 7px;
  }
  /* RIGHT: floating, scrollable playlist panel — overlays the full-screen player */
  .thumbs-col {
    position: absolute;
    top: 14px;
    right: 14px;
    bottom: auto;
    max-height: calc(100% - 104px);
    width: var(--pl-w);
    z-index: 25;
    display: flex;
    flex-direction: column;
    background: transparent;
    backdrop-filter: none;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 10px;
    box-shadow: none;
    min-height: 0;
    transition: transform 0.2s ease, opacity 0.2s ease;
    overflow: hidden;
  }
  .thumbs-col.hidden {
    transform: translateX(calc(100% + 24px));
    opacity: 0;
    pointer-events: none;
  }
  .thumbs-title {
    font-size: 0.72rem;
    color: #999;
    margin: 2px 2px 8px 2px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .switches-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }
  .controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 2px 8px 2px;
    flex-shrink: 0;
  }
  .autorun-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .autorun-label {
    font-size: 0.50rem;
    color: #999;
    user-select: none;
  }
  .autorun-switch {
    position: relative;
    width: 24px;
    height: 14px;
    flex-shrink: 0;
    background: #333;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .autorun-switch.on {
    background: #2c6b4f;
    border-color: #3a8562;
  }
  .autorun-switch .knob {
    position: absolute;
    top: 1px;
    left: 1px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ccc;
    transition: left 0.15s, background 0.15s;
  }
  .autorun-switch.on .knob {
    left: 13px;
    background: #5da9ff;
  }
  .search-toggle-btn {
    background: rgba(255,255,255,0.06);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 0.72rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .search-toggle-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.1); }
  .search-toggle-btn.active {
    background: rgba(93,169,255,0.22);
    border-color: rgba(93,169,255,0.1);
    color: #fff;
  }
  .search-wrap {
    position: relative;
    flex: 0 1 0;
    min-width: 0;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    margin: 0;
    transition: max-width 0.2s ease, opacity 0.15s ease;
  }
  .search-wrap.open {
    flex: 1 1 auto;
    max-width: 400px;
    opacity: 1;
    overflow: visible;
  }
  .search-input {
    width: 100%;
    background: #262626;
    color: #eee;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: 5px 24px 5px 8px;
    font-size: 0.68rem;
    outline: none;
    box-sizing: border-box;
  }
  .search-input:focus {
    border-color: #5da9ff;
  }
  .search-clear {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #888;
    font-size: 0.7rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    display: none;
  }
  .search-clear.show {
    display: block;
  }
  .search-clear:hover {
    color: #eee;
  }
  .thumb.filtered-out {
    display: none;
  }
  .category-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 0 2px 8px 2px;
    flex-shrink: 0;
  }
  .category-chip {
    background: rgba(255,255,255,0.06);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 0.62rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .category-chip:hover { background: rgba(255,255,255,0.16); color: #eee; border-color: rgba(255,255,255,0.5); }
  .category-chip.active {
    background: rgba(93,169,255,0.22);
    border-color: rgba(93,169,255,0.7);
    color: #fff;
  }
  .thumbs {
    overflow-y: auto;
    overflow-x: hidden;
    display: grid;
    grid-template-columns: repeat(var(--pl-cols), minmax(0, 1fr));
    grid-auto-rows: var(--pl-row-h);
    gap: var(--pl-gap);
    padding-right: 6px;
    min-height: 0;
    flex: 0 1 auto;
    /* exactly 6 rows tall; more titles scroll */
    max-height: calc(var(--pl-rows) * var(--pl-row-h) + (var(--pl-rows) - 1) * var(--pl-gap));
  }
  .thumbs::-webkit-scrollbar { width: 6px; }
  .thumbs::-webkit-scrollbar-thumb {
    background: #3a3a3a;
    border-radius: 3px;
  }
  .thumbs::-webkit-scrollbar-track { background: transparent; }

  .thumb {
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    background: transparent;
    transition: border-color 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-width: 0;
    height: 100%;
  }
  .thumb { contain: layout paint; }
  .thumbs { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  @media (hover: none) { .thumb:hover { border-color: transparent; } }
  .thumb:hover { border-color: #4a4a4a; }
  .thumb.active { border-color: #5da9ff; }

  .thumb img {
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    object-fit: cover;
    display: block;
    background: #000;
    flex-shrink: 0;
  }
  .thumb .label {
    font-size: 0.6rem;
    padding: 3px 4px 0;
    color: #da8;
    line-height: 1.2;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .thumb .play-icon {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    background: rgba(0,0,0,0.55);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.5rem;
    color: #fff;
  }

  /* ---- Series thumbnail: one card represents a whole show, badged with episode count ---- */
  .thumb.series-thumb .label {
    display: flex;
    flex-direction: column;
    gap: 1px;
    -webkit-line-clamp: unset;
  }
  .thumb.series-thumb .label .series-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .thumb.series-thumb .label .series-name {
    color: #da8;
  }
  .thumb.series-thumb .label .series-count {
    font-size: 0.58rem;
    color: #5da9ff;
  }
  .thumb .stack-icon {
    position: absolute;
    top: 3px;
    right: 3px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 0.52rem;
    padding: 1px 5px;
    border-radius: 8px;
    line-height: 1.3;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .thumb.series-thumb img {
    box-shadow: -3px 0 0 -1px rgba(255,255,255,0.15), -6px 0 0 -2px rgba(255,255,255,0.08);
  }

  /* ---- Episode picker: overlay panel listing all episodes of a selected series ---- */
  /* ---- Episode picker: overlay panel listing all episodes of a selected series.
     Sits on the LEFT (the main playlist panel lives on the right), and starts
     below the "Show/Hide Playlist" toggle button so the two never overlap. ---- */
  /* ---- Episode picker: overlay panel listing all episodes of a selected series.
     Docked just to the LEFT of the main playlist panel (which sits at right:14,
     width:230), starts below the "Show/Hide Playlist" toggle button, and sizes
     itself to its content instead of stretching the full height of the stage. ---- */
  #episodePanel {
    position: absolute;
    top: 56px;
    right: calc(var(--pl-w) + 24px);
    max-height: calc(100% - 90px);
    width: 300px;
    max-width: 40%;
    background: rgba(12,12,12,0);
    border: 1px solid rgba(255,255,255,0.01);
    border-radius: 10px;
    z-index: 40;
    display: none;
    flex-direction: column;
    padding: 14px 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
  }
  #episodePanel.open { display: flex; }
  .episode-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .episode-header .episode-title {
    font-size: 0.92rem;
    font-weight: 600;
    color: #fff;
  }
  .episode-close {
    background: rgba(255,255,255,0.05);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 0.7rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .episode-close:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.05); }
  .episode-list {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
    padding-right: 4px;
  }
  .episode-list::-webkit-scrollbar { width: 6px; }
  .episode-list::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }

  /* ---- Idle overlay image: a single <img> pinned above every other element
     on the page (playlist, panels, controls, everything). Sits at 50% opacity
     whenever no video is loaded/active (initial state, buffering, ended, or
     emptied) — but NOT while merely paused — and fades to fully invisible
     the instant playback actually starts. Uses a plain image URL (no
     base64), and pointer-events are disabled so it never blocks clicks/taps. ---- */
  .idle-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.5s ease, visibility 0s linear 0.5s;
  }
  .idle-overlay.show {
    opacity: 0.35;

    transition: opacity 0.5s ease, visibility 0s;
  }

</style>

<body>
<script src="data/datas_blurInfoCoded.js"></script>
