<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOT TV</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #000 url("back_banner.jpg") center center / cover no-repeat;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* Optional dark glass overlay */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.08);
        pointer-events: none;
    }

    .content {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Add your OTT controls/content inside this area */
    .center-content {
        text-align: center;
        color: white;
    }
</style>
</head>

<body>
    <div class="overlay"></div>

    <main class="content">
        <div class="center-content">
            <!-- Your OTT interface can be added here -->
        </div>
    </main>
</body>
</html>
