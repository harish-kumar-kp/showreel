<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H.265/HEVC Video Sample</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    background: #111;
    color: #eee;
  }
  h1 { font-size: 1.4rem; }
  video {
    width: 100%;
    border-radius: 8px;
    background: #000;
    display: block;
  }
  #status {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 0.9rem;
    background: #222;
    border-left: 4px solid #555;
  }
  #status.ok { border-left-color: #3ecf8e; }
  #status.fallback { border-left-color: #f5a623; }
  #status.error { border-left-color: #e5484d; }
  code { background: #222; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<h1>H.265 (HEVC) Video — with automatic H.264 fallback</h1>

<video id="player" controls playsinline preload="metadata">
  <!-- Browser picks the first source it can actually decode -->
  <source src="https://media.istockphoto.com/id/1016276532/video/duck-in-the-lake.mp4" type='video/mp4; codecs="hvc1.1.6.L93.B0"'>
  <source src="https://media.istockphoto.com/id/1016276532/video/duck-in-the-lake.mp4" type="video/mp4">
  Your browser does not support HTML5 video.
</video>

<div id="status">Checking codec support…</div>

<script>
  const video = document.getElementById('player');
  const statusEl = document.getElementById('status');

  // Feature-detect HEVC support before playback even starts
  function checkHevcSupport() {
    const testVideo = document.createElement('video');
    const canPlayHevc = testVideo.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"');
    return canPlayHevc; // '', 'maybe', or 'probably'
  }

  const hevcSupport = checkHevcSupport();

  if (hevcSupport === 'probably' || hevcSupport === 'maybe') {
    statusEl.textContent = 'HEVC (H.265) appears to be supported — playing native H.265 source.';
    statusEl.className = 'ok';
  } else {
    statusEl.textContent = 'HEVC not supported in this browser — falling back to H.264 source.';
    statusEl.className = 'fallback';
  }

  // Catch actual playback failures (codec detection isn't 100% reliable)
  video.addEventListener('error', () => {
    statusEl.textContent = 'Playback error — check that video-hevc.mp4 / video-h264.mp4 exist and are reachable.';
    statusEl.className = 'error';
  });

  video.addEventListener('loadedmetadata', () => {
    if (statusEl.className !== 'error') {
      statusEl.textContent += ` (${video.videoWidth}×${video.videoHeight})`;
    }
  });
</script>

<h2 style="font-size:1rem;margin-top:30px;">Notes</h2>

</body>
</html>
